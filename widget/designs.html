<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Four visual directions for the WebRAG Systems landing page">
    <title>WebRAG — Landing page concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; min-height: 100vh; }
        button, a { font: inherit; }
        a { color: inherit; }
        svg { display: block; }
        ::selection { background: #806dff; color: #fff; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        /* Comparison controls */
        .concept-switcher {
            position: fixed; z-index: 1000; left: 50%; bottom: 22px; transform: translateX(-50%);
            display: flex; align-items: center; gap: 5px; padding: 6px;
            border: 1px solid rgba(255,255,255,.24); border-radius: 999px;
            background: rgba(14,15,22,.82); color: #fff;
            box-shadow: 0 18px 60px rgba(0,0,0,.28); backdrop-filter: blur(18px);
        }
        .concept-switcher a {
            display: flex; align-items: center; justify-content: center; height: 38px;
            min-width: 38px; padding: 0 13px; border-radius: 999px; text-decoration: none;
            color: rgba(255,255,255,.64); font: 600 12px/1 'DM Sans', sans-serif;
            transition: .2s ease;
        }
        .concept-switcher a:hover { color: #fff; background: rgba(255,255,255,.1); }
        .concept-switcher a.active { color: #11121a; background: #fff; }
        .concept-switcher .gallery-link { gap: 7px; padding-left: 14px; border-right: 1px solid rgba(255,255,255,.14); border-radius: 999px 6px 6px 999px; }

        /* Gallery */
        .gallery {
            min-height: 100vh; padding: 44px clamp(20px, 5vw, 72px) 80px;
            color: #e9e8f3; background:
                radial-gradient(circle at 12% 12%, rgba(105,84,255,.22), transparent 26%),
                radial-gradient(circle at 85% 4%, rgba(39,217,192,.14), transparent 22%),
                #111119; font-family: 'DM Sans', sans-serif;
        }
        .gallery-shell { width: min(1320px, 100%); margin: 0 auto; }
        .gallery-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .gallery-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.03em; }
        .gallery-logo-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #7d6aff; color: #fff; }
        .gallery-meta { color: #898896; font-size: 13px; }
        .gallery-intro { max-width: 840px; padding: 100px 0 54px; }
        .gallery-kicker { color: #9d8fff; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; }
        .gallery h1 { margin: 18px 0 20px; font: 600 clamp(42px, 7vw, 86px)/.98 'Space Grotesk', sans-serif; letter-spacing: -.065em; }
        .gallery-intro p { max-width: 650px; margin: 0; color: #a8a7b5; font-size: clamp(16px, 2vw, 19px); line-height: 1.65; }
        .concept-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
        .concept-card {
            min-height: 430px; position: relative; overflow: hidden; display: flex; flex-direction: column;
            padding: 26px; border: 1px solid rgba(255,255,255,.11); border-radius: 26px;
            color: #fff; text-decoration: none; background: #1b1b25; isolation: isolate;
            transition: transform .35s ease, border-color .35s ease;
        }
        .concept-card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,.28); }
        .concept-card-top { display: flex; justify-content: space-between; gap: 20px; position: relative; z-index: 2; }
        .concept-number { color: rgba(255,255,255,.46); font: 500 12px/1 'IBM Plex Mono', monospace; }
        .concept-arrow { width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; display: grid; place-items: center; transition: .25s ease; }
        .concept-card:hover .concept-arrow { transform: rotate(45deg); background: #fff; color: #111; }
        .concept-preview { flex: 1; min-height: 230px; position: relative; margin: 20px 0 14px; border-radius: 18px; overflow: hidden; }
        .concept-info { position: relative; z-index: 2; }
        .concept-info h2 { margin: 0 0 7px; font: 600 26px/1.1 'Space Grotesk', sans-serif; letter-spacing: -.04em; }
        .concept-info p { margin: 0; color: rgba(255,255,255,.57); font-size: 13px; line-height: 1.5; }
        .preview-1 { background: radial-gradient(circle at 70% 35%, rgba(108,95,255,.48), transparent 24%), linear-gradient(140deg,#07101e,#131942); }
        .preview-1::before { content: ''; position: absolute; inset: 22% 8%; border: 1px solid rgba(109,220,255,.35); border-radius: 50%; transform: rotate(-12deg); box-shadow: 0 0 45px rgba(111,91,255,.22); }
        .preview-1::after { content: ''; position: absolute; width: 90px; height: 90px; border-radius: 50%; top: 50%; left: 60%; transform: translate(-50%,-50%); background: radial-gradient(circle at 35% 30%,#dffffc,#55dfd0 20%,#6e5cff 62%,transparent 64%); filter: drop-shadow(0 0 30px #765fff); }
        .preview-2 { background: #f4f0e8; }
        .preview-2::before { content: 'YOUR SITE, NOW\A AN INTELLIGENT\A SERVICE.'; white-space: pre; position: absolute; left: 26px; top: 28px; color: #151515; font: 700 clamp(24px, 4vw, 48px)/.87 'Space Grotesk', sans-serif; letter-spacing: -.08em; }
        .preview-2::after { content: 'AI'; position: absolute; right: 22px; bottom: 18px; width: 74px; height: 74px; display: grid; place-items: center; background: #2f48e9; color: #fff; border-radius: 50%; font: 700 20px 'Space Grotesk'; }
        .preview-3 { background-color: #090d0b; background-image: linear-gradient(rgba(118,255,174,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(118,255,174,.07) 1px,transparent 1px); background-size: 26px 26px; }
        .preview-3::before { content: 'AGENT NETWORK  /  ONLINE'; position: absolute; top: 24px; left: 24px; color: #8bffa8; font: 500 11px 'IBM Plex Mono'; }
        .preview-3::after { content: '●  CRAWL\A ●  RETRIEVE\A ●  RESPOND'; white-space: pre; position: absolute; right: 26px; bottom: 24px; padding: 20px 24px; border: 1px solid rgba(139,255,168,.28); color: #b8ffc9; background: rgba(5,15,9,.78); font: 500 13px/2 'IBM Plex Mono'; }
        .preview-4 { background: linear-gradient(145deg,#fbfbff,#ebe8ff); }
        .preview-4::before { content: ''; position: absolute; width: 170px; height: 170px; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(20deg); border-radius: 46px; background: linear-gradient(135deg,#ff805a,#9f80ff 55%,#5cdbdd); box-shadow: -85px 45px 0 -48px #fff, 98px -40px 0 -55px #fff; }
        .preview-4::after { content: 'One intelligence layer'; position: absolute; left: 26px; bottom: 22px; padding: 9px 13px; color: #3a3256; background: rgba(255,255,255,.78); border: 1px solid rgba(94,76,150,.15); border-radius: 12px; backdrop-filter: blur(12px); font: 600 12px 'DM Sans'; }

        /* Shared concept pieces */
        .concept-page { min-height: 100vh; overflow: hidden; }
        .concept-nav { display: flex; align-items: center; justify-content: space-between; width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0; position: relative; z-index: 20; }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; letter-spacing: -.04em; }
        .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; }
        .nav-links { display: flex; align-items: center; gap: 30px; }
        .nav-links a { text-decoration: none; font-size: 13px; font-weight: 600; }
        .nav-actions { display: flex; align-items: center; gap: 9px; }
        .nav-lang { display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 999px; }
        .nav-lang button { border: 0; background: transparent; cursor: pointer; padding: 7px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; }
        .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 700; transition: .22s ease; }
        .button:hover { transform: translateY(-2px); }
        .button svg { width: 17px; height: 17px; }
        .section-eyebrow { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }
        .section-eyebrow::before { content: ''; width: 28px; height: 1px; background: currentColor; }

        /* Concept 1: Neural Atlas */
        .c1 { color: #f5f6ff; background: #070a12; font-family: 'DM Sans', sans-serif; }
        .c1 .c1-bg { position: absolute; inset: 0 0 auto; height: 900px; pointer-events: none; background: radial-gradient(circle at 78% 30%,rgba(80,59,255,.22),transparent 27%),radial-gradient(circle at 64% 12%,rgba(64,224,218,.12),transparent 22%); }
        .c1 .concept-nav { border-bottom: 1px solid rgba(255,255,255,.08); }
        .c1 .brand-mark { background: linear-gradient(135deg,#69f2d4,#8067ff); color: #07100f; box-shadow: 0 0 25px rgba(102,235,210,.24); }
        .c1 .nav-links a { color: #9298ad; }
        .c1 .nav-links a:hover { color: #fff; }
        .c1 .nav-lang { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
        .c1 .nav-lang button { color: #777f96; }
        .c1 .nav-lang .active { color: #080b14; background: #6be3d2; }
        .c1 .nav-portal { color: #eef0ff; border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.04); }
        .c1-hero { width: min(1240px, calc(100% - 40px)); min-height: 720px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 50px; position: relative; }
        .c1-copy { position: relative; z-index: 3; padding: 85px 0 110px; }
        .c1 .section-eyebrow { color: #69e7d1; }
        .c1 h1 { max-width: 760px; margin: 23px 0 26px; font: 600 clamp(54px,7vw,94px)/.93 'Space Grotesk',sans-serif; letter-spacing: -.072em; }
        .c1 h1 span { color: #7d72ff; }
        .c1-copy > p { max-width: 570px; color: #9298ad; font-size: 17px; line-height: 1.7; }
        .c1-ctas { display: flex; align-items: center; gap: 12px; margin-top: 36px; }
        .c1 .button-primary { color: #08100f; background: #73ead5; box-shadow: 0 12px 38px rgba(78,221,198,.15); }
        .c1 .button-secondary { color: #dce0ee; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.12); }
        .micro-proof { display: flex; align-items: center; gap: 14px; margin-top: 36px; color: #747b91; font-size: 12px; }
        .avatar-stack { display: flex; }
        .avatar-stack i { width: 25px; height: 25px; margin-left: -6px; border: 2px solid #080b13; border-radius: 50%; background: linear-gradient(135deg,#fca56b,#8a6bff); }
        .avatar-stack i:nth-child(2) { background: linear-gradient(135deg,#6be8d2,#5b7cff); }
        .avatar-stack i:nth-child(3) { background: linear-gradient(135deg,#f38ac7,#745dff); }
        .c1-visual { min-height: 570px; position: relative; display: grid; place-items: center; }
        .atlas-orbit { width: min(530px, 43vw); aspect-ratio: 1; position: relative; border: 1px solid rgba(111,205,255,.13); border-radius: 50%; animation: orbitFloat 8s ease-in-out infinite; }
        .atlas-orbit::before,.atlas-orbit::after { content:''; position:absolute; border:1px solid rgba(119,100,255,.16); border-radius:50%; }
        .atlas-orbit::before { inset: 14%; }
        .atlas-orbit::after { inset: 31%; box-shadow: 0 0 70px rgba(97,80,255,.2); }
        .orbit-line { position:absolute; inset:8%; border:1px solid rgba(100,234,217,.16); border-radius:50%; transform:rotate(58deg) scaleY(.42); }
        .atlas-core { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:150px; height:150px; display:grid; place-items:center; border-radius:44px; background:radial-gradient(circle at 30% 22%,#ecfffb 0 5%,#6fe7d2 6% 24%,#6755f4 58%,#181844 73%); box-shadow:0 0 0 13px rgba(106,93,255,.06),0 0 80px rgba(98,76,255,.45); }
        .atlas-core svg { width: 48px; color:#fff; filter:drop-shadow(0 0 9px rgba(255,255,255,.8)); }
        .orbit-node { position:absolute; display:flex; align-items:center; gap:9px; padding:9px 12px; border:1px solid rgba(255,255,255,.11); border-radius:11px; color:#cdd2e7; background:rgba(17,21,36,.77); box-shadow:0 12px 30px rgba(0,0,0,.3); backdrop-filter:blur(12px); font-size:11px; font-weight:600; }
        .orbit-node i { width:7px; height:7px; border-radius:50%; background:#6ce7d1; box-shadow:0 0 12px #6ce7d1; }
        .node-1 { top:11%; left:7%; }.node-2 { top:27%; right:-2%; }.node-3 { bottom:17%; right:4%; }.node-4 { bottom:8%; left:10%; }
        .c1-status { position:absolute; right:6%; bottom:4%; width:220px; padding:16px; border:1px solid rgba(255,255,255,.11); border-radius:15px; background:rgba(12,15,26,.8); backdrop-filter:blur(16px); }
        .c1-status-top { display:flex; justify-content:space-between; color:#777f94; font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
        .c1-status-top span:last-child { color:#6ce6d0; }
        .wave { display:flex; align-items:end; gap:3px; height:36px; margin-top:12px; }
        .wave i { flex:1; height:var(--h); border-radius:4px; background:linear-gradient(#6be7d0,#6c5ffc); opacity:.75; animation:wave 1.8s ease-in-out infinite alternate; }
        .c1-proof { width:min(1240px,calc(100% - 40px)); margin:0 auto 100px; padding:30px; display:grid; grid-template-columns:1.3fr repeat(3,1fr); align-items:center; border:1px solid rgba(255,255,255,.08); border-radius:20px; background:rgba(255,255,255,.025); }
        .c1-proof p { margin:0; color:#7f8699; font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
        .c1-stat { padding:6px 28px; border-left:1px solid rgba(255,255,255,.08); }
        .c1-stat strong { display:block; color:#f2f4ff; font:600 28px 'Space Grotesk'; }
        .c1-stat span { color:#777e91; font-size:11px; }
        .c1-workflow { padding:120px max(20px,calc((100% - 1240px)/2)); background:#0a0e18; border-top:1px solid rgba(255,255,255,.06); }
        .c1-workflow-head { display:flex; justify-content:space-between; align-items:end; gap:30px; margin-bottom:42px; }
        .c1-workflow h2 { max-width:650px; margin:12px 0 0; font:600 clamp(36px,5vw,62px)/1 'Space Grotesk'; letter-spacing:-.055em; }
        .c1-workflow-head > p { max-width:390px; color:#7f8698; font-size:14px; line-height:1.6; }
        .flow-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
        .flow-card { min-height:230px; padding:22px; position:relative; border:1px solid rgba(255,255,255,.08); border-radius:17px; background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)); }
        .flow-card::after { content:''; position:absolute; top:35px; right:-13px; width:25px; height:1px; background:#4e5362; z-index:3; }
        .flow-card:last-child::after { display:none; }
        .flow-num { color:#6fe4d0; font:500 10px 'IBM Plex Mono'; }
        .flow-icon { width:46px; height:46px; display:grid; place-items:center; margin:35px 0 24px; border-radius:13px; background:rgba(111,101,255,.13); color:#8e81ff; }
        .flow-icon svg { width:21px; }
        .flow-card h3 { margin:0 0 8px; font:600 16px 'Space Grotesk'; }
        .flow-card p { margin:0; color:#737b8e; font-size:12px; line-height:1.55; }

        /* Concept 2: Editorial Intelligence */
        .c2 { color:#181817; background:#f0ede5; font-family:'DM Sans',sans-serif; }
        .c2 .concept-nav { border-bottom:1px solid #cbc6ba; }
        .c2 .brand { font:700 18px 'Space Grotesk'; text-transform:uppercase; }
        .c2 .brand-mark { background:#2e4bea; color:#fff; border-radius:0; }
        .c2 .nav-links a { color:#605e58; }
        .c2 .nav-lang { border:1px solid #bdb9ae; }
        .c2 .nav-lang button { color:#6c6a64; }
        .c2 .nav-lang .active { color:#fff; background:#181817; }
        .c2 .nav-portal { color:#fff; background:#181817; border-radius:0; }
        .c2-hero { width:min(1240px,calc(100% - 40px)); margin:0 auto; padding:75px 0 0; }
        .c2-title-row { display:grid; grid-template-columns:1.25fr .75fr; gap:55px; align-items:end; }
        .c2 .section-eyebrow { color:#2d49e5; }
        .c2 h1 { margin:22px 0 0; font:700 clamp(62px,9.4vw,136px)/.78 'Space Grotesk',sans-serif; letter-spacing:-.09em; text-transform:uppercase; }
        .c2 h1 em { color:#2f4be5; font-style:normal; }
        .c2-sidecopy { padding-bottom:8px; }
        .c2-sidecopy p { margin:0 0 30px; font-size:17px; line-height:1.65; color:#54524d; }
        .c2 .button-primary { background:#2f4be5; color:#fff; border-radius:0; box-shadow:8px 8px 0 #181817; }
        .c2 .button-primary:hover { box-shadow:4px 4px 0 #181817; transform:translate(4px,4px); }
        .editorial-board { margin-top:65px; display:grid; grid-template-columns:1.2fr .8fr; min-height:440px; border-top:1px solid #aaa69b; border-bottom:1px solid #aaa69b; }
        .editorial-visual { position:relative; overflow:hidden; display:flex; align-items:end; padding:28px; background:#2948e9; color:#fff; }
        .editorial-visual::before { content:''; position:absolute; width:430px; height:430px; top:-150px; right:-70px; border:1px solid rgba(255,255,255,.38); border-radius:50%; box-shadow:0 0 0 55px rgba(255,255,255,.06),0 0 0 110px rgba(255,255,255,.04); }
        .editorial-visual::after { content:'W'; position:absolute; right:30px; bottom:-70px; color:rgba(255,255,255,.08); font:700 320px/1 'Space Grotesk'; }
        .visual-caption { position:relative; z-index:2; max-width:470px; }
        .visual-label { font:500 11px 'IBM Plex Mono'; letter-spacing:.08em; text-transform:uppercase; }
        .visual-caption h2 { margin:18px 0 0; font:600 clamp(32px,4.5vw,64px)/.95 'Space Grotesk'; letter-spacing:-.06em; }
        .editorial-feed { background:#dedacf; border-left:1px solid #aaa69b; }
        .feed-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #aaa69b; font:600 11px 'IBM Plex Mono'; text-transform:uppercase; }
        .live-dot { display:flex; align-items:center; gap:7px; color:#2f4be5; }
        .live-dot::before { content:''; width:7px; height:7px; border-radius:50%; background:#2f4be5; }
        .feed-item { display:grid; grid-template-columns:50px 1fr auto; gap:12px; align-items:center; padding:24px 22px; border-bottom:1px solid #b8b3a7; }
        .feed-item:last-child { border:0; }
        .feed-icon { width:43px; height:43px; display:grid; place-items:center; color:#2f4be5; border:1px solid #aaa69b; }
        .feed-icon svg { width:19px; }
        .feed-item strong { display:block; font-size:13px; }
        .feed-item small { color:#6e6b64; font-size:11px; }
        .feed-time { color:#77736c; font:500 10px 'IBM Plex Mono'; }
        .c2-metrics { display:grid; grid-template-columns:repeat(4,1fr); width:min(1240px,calc(100% - 40px)); margin:0 auto; border-left:1px solid #aaa69b; }
        .c2-metric { padding:36px 25px; border-right:1px solid #aaa69b; }
        .c2-metric strong { display:block; font:700 38px 'Space Grotesk'; letter-spacing:-.06em; }
        .c2-metric span { color:#66635c; font-size:11px; }
        .c2-process { padding:130px max(20px,calc((100% - 1240px)/2)); background:#181817; color:#f2efe8; }
        .c2-process-head { display:grid; grid-template-columns:1fr 1fr; align-items:end; gap:40px; margin-bottom:56px; }
        .c2-process h2 { margin:15px 0 0; font:600 clamp(42px,6vw,76px)/.92 'Space Grotesk'; letter-spacing:-.07em; text-transform:uppercase; }
        .c2-process-head p { max-width:500px; margin:0 0 8px; color:#97938a; font-size:15px; line-height:1.7; }
        .editorial-steps { display:grid; grid-template-columns:repeat(2,1fr); border-top:1px solid #4b4945; border-left:1px solid #4b4945; }
        .editorial-step { min-height:260px; padding:30px; border-right:1px solid #4b4945; border-bottom:1px solid #4b4945; position:relative; }
        .editorial-step b { position:absolute; right:25px; top:20px; color:#53514c; font:500 44px 'Space Grotesk'; }
        .step-symbol { width:44px; height:44px; display:grid; place-items:center; background:#2e49e5; color:#fff; }
        .step-symbol svg { width:20px; }
        .editorial-step h3 { margin:48px 0 10px; font:600 22px 'Space Grotesk'; }
        .editorial-step p { max-width:430px; margin:0; color:#8d8981; font-size:13px; line-height:1.6; }

        /* Concept 3: Command Center */
        .c3 { color:#e9ffed; background:#070a08; font-family:'IBM Plex Mono',monospace; }
        .c3::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.34; background-image:linear-gradient(rgba(111,255,151,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(111,255,151,.035) 1px,transparent 1px); background-size:38px 38px; }
        .c3 .concept-nav { width:min(1320px,calc(100% - 32px)); padding:15px 0; border-bottom:1px solid rgba(133,255,165,.18); }
        .c3 .brand { font-size:13px; letter-spacing:.01em; text-transform:uppercase; }
        .c3 .brand-mark { width:28px; height:28px; color:#061008; background:#85ffa4; border-radius:3px; }
        .c3 .nav-links a { color:#66836d; font-size:11px; text-transform:uppercase; }
        .c3 .nav-links a:hover { color:#9dffb4; }
        .c3 .nav-lang { border:1px solid rgba(133,255,165,.2); border-radius:3px; }
        .c3 .nav-lang button { color:#57725e; border-radius:2px; }
        .c3 .nav-lang .active { color:#071009; background:#85ffa4; }
